# Tiny Tapeout project information

project:
  title: "Neurona LIF con Aprendizaje STDP Dinamico"
  author: "Casandra Saray Galiano Quillahuaman"
  discord: "casandra6171"
  description: "Neurona artificial biologica con plasticidad configurable y monitoreo de peso en tiempo real."
  language: "Verilog"
  clock_hz: 10000000
  tiles: "1x1"

  top_module: "tt_um_example"

  source_files:
    - "project.v"
    - "neuron_lif.v"
    - "stdp_core.v"

  pinout:

    # Inputs
    ui[0]: "Pulso de entrada externo spike_pre"
    ui[1]: "Bit 0 de configuracion de fuga leak"
    ui[2]: "Bit 1 de configuracion de fuga leak"
    ui[3]: "Bit 2 de configuracion de fuga leak"
    ui[4]: "Bit 3 de configuracion de fuga leak"
    ui[5]: "Bit 0 de ventana de tiempo STDP"
    ui[6]: "Bit 1 de ventana de tiempo STDP"
    ui[7]: "Bit 2 de ventana de tiempo STDP"

    # Outputs
    uo[0]: "Pulso de salida de la neurona spike_post"
    uo[1]: "Bit 0 de monitoreo de peso sinaptico"
    uo[2]: "Bit 1 de monitoreo de peso sinaptico"
    uo[3]: "Bit 2 de monitoreo de peso sinaptico"
    uo[4]: "Bit 3 de monitoreo de peso sinaptico"
    uo[5]: "Bit 4 de monitoreo de peso sinaptico"
    uo[6]: "Bit 5 de monitoreo de peso sinaptico"
    uo[7]: "Pin no utilizado"

    # Bidirectional pins
    uio[0]: "Bit 0 de configuracion de umbral threshold"
    uio[1]: "Bit 1 de configuracion de umbral threshold"
    uio[2]: "Bit 2 de configuracion de umbral threshold"
    uio[3]: "Bit 3 de configuracion de umbral threshold"
    uio[4]: ""
    uio[5]: ""
    uio[6]: ""
    uio[7]: ""

# Do not change!
yaml_version: 6